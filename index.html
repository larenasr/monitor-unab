<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unab Grupo1 – Monitor MQTT</title>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#f6f7fb;color:#222}
  header{background:#1f2a44;color:#fff;padding:14px 20px}
  header h1{margin:0;font-size:18px}
  .wrap{max-width:1000px;margin:auto;padding:16px}
  .card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px;margin-bottom:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;color:#555;display:flex;flex-direction:column;gap:4px}
  input{padding:7px 9px;border:1px solid #ccc;border-radius:6px;font-size:14px}
  button{padding:8px 16px;border:0;border-radius:6px;background:#2f6fed;color:#fff;font-size:14px;cursor:pointer}
  button.sec{background:#888}
  #estado{font-size:13px;margin-left:auto}
  .kpis{display:flex;gap:16px}
  .kpi{flex:1;text-align:center}
  .kpi .v{font-size:34px;font-weight:600}
  .kpi .t{font-size:12px;color:#666}
  canvas{max-height:300px}
  #log{font-family:monospace;font-size:12px;max-height:150px;overflow:auto;background:#fafafa;padding:8px;border-radius:6px}
</style>
</head>
<body>
<header><h1>Unab / Grupo1 – Sensores en tiempo real</h1></header>
<div class="wrap">

  <div class="card">
    <div class="row">
      <label>Broker (WebSocket)
        <input id="url" size="34" value="wss://broker.emqx.io:8084/mqtt">
      </label>
      <label>Tópico
        <input id="topic" size="24" value="Unab/Grupo1/Sensor/#">
      </label>
      <label>Usuario (opcional)<input id="user" size="10"></label>
      <label>Clave (opcional)<input id="pass" type="password" size="10"></label>
      <button id="btn">Conectar</button>
      <button id="sim" class="sec">Simular datos</button>
      <span id="estado">Desconectado</span>
    </div>
  </div>

  <div class="card kpis">
    <div class="kpi"><div class="v" id="vT">–</div><div class="t">Temperatura (último valor)</div></div>
    <div class="kpi"><div class="v" id="vH">–</div><div class="t">Humedad (último valor)</div></div>
  </div>

  <div class="card"><canvas id="cT"></canvas></div>
  <div class="card"><canvas id="cH"></canvas></div>

  <div class="card"><b>Mensajes recibidos</b><div id="log"></div></div>
</div>

<script>
const MAX = 60; // puntos visibles
function mkChart(id, label, color){
  return new Chart(document.getElementById(id), {
    type:'line',
    data:{labels:[], datasets:[{label, data:[], borderColor:color, backgroundColor:color+'22', fill:true, tension:.3, pointRadius:2}]},
    options:{animation:false, responsive:true, plugins:{legend:{display:true}}, scales:{x:{ticks:{maxTicksLimit:8}}}}
  });
}
const chT = mkChart('cT','Temperatura','#e4572e');
const chH = mkChart('cH','Humedad','#2f6fed');

function push(chart, value){
  const t = new Date().toLocaleTimeString();
  chart.data.labels.push(t);
  chart.data.datasets[0].data.push(value);
  if(chart.data.labels.length > MAX){ chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
  chart.update();
}

// Toma el primer número del JSON, sin importar el nombre de la llave
// (así funciona aunque diga "Temoeratura")
function numero(payload){
  try{
    const o = JSON.parse(payload);
    if(typeof o === 'number') return o;
    for(const k in o){ const n = parseFloat(o[k]); if(!isNaN(n)) return n; }
  }catch(e){}
  const n = parseFloat(payload); return isNaN(n) ? null : n;
}

function procesar(topic, payload){
  const v = numero(payload);
  const log = document.getElementById('log');
  log.insertAdjacentText('afterbegin', `${new Date().toLocaleTimeString()}  ${topic}  ${payload}\n`);
  if(v === null) return;
  const tl = topic.toLowerCase();
  if(tl.includes('temp')){ push(chT, v); document.getElementById('vT').textContent = v; }
  else if(tl.includes('hum')){ push(chH, v); document.getElementById('vH').textContent = v; }
}

let client = null;
const estado = document.getElementById('estado');
document.getElementById('btn').onclick = () => {
  if(client){ client.end(true); client = null; estado.textContent='Desconectado'; btn.textContent='Conectar'; return; }
  const opts = { clientId:'web_'+Math.random().toString(16).slice(2,10), clean:true, reconnectPeriod:3000 };
  const u = document.getElementById('user').value, p = document.getElementById('pass').value;
  if(u) opts.username = u; if(p) opts.password = p;
  estado.textContent = 'Conectando…';
  client = mqtt.connect(document.getElementById('url').value, opts);
  client.on('connect', () => {
    const tp = document.getElementById('topic').value;
    client.subscribe(tp, {qos:0});
    estado.textContent = '🟢 Conectado – suscrito a ' + tp;
    btn.textContent = 'Desconectar';
  });
  client.on('message', (t, m) => procesar(t, m.toString()));
  client.on('error', e => estado.textContent = '🔴 Error: ' + e.message);
  client.on('close', () => { if(client) estado.textContent = '🟠 Reconectando…'; });
};

let simTimer = null;
document.getElementById('sim').onclick = (e) => {
  if(simTimer){ clearInterval(simTimer); simTimer=null; e.target.textContent='Simular datos'; return; }
  e.target.textContent = 'Detener simulación';
  simTimer = setInterval(() => {
    procesar('Unab/Grupo1/Sensor/Temperatura', JSON.stringify({Temoeratura: Math.round(230 + Math.random()*15)}));
    procesar('Unab/Grupo1/Sensor/Humedad', JSON.stringify({Humedad: Math.round(560 + Math.random()*40)}));
  }, 1000);
};
</script>
</body>
</html>
